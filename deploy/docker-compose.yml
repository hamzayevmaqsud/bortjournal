# Lumi на сервере: Postgres, API с вебом, воркер, Caddy (https от Let's Encrypt сам) и ежедневный бэкап.
# Запуск: cd deploy && cp .env.example .env && (заполнить) && docker compose up -d --build
# Подробно — docs/deploy.md

# своё имя проекта: иначе Docker назовёт его по папке («deploy») и он может совпасть с чужим проектом на том же сервере
name: lumi

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?впиши POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: lumi
      # кириллица: поиск без учёта регистра (lower) работает только с UTF-8-локалью
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumi"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ..
    image: lumi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/lumi
      TRUST_PROXY: "true"
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: lumi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/lumi
    command: ["npx", "tsx", "src/worker.ts"]
    volumes:
      - data:/app/data
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?впиши DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lumi
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  data:
  caddy_data:
  caddy_config:
