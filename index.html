<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE3CE">
<title>Бортжурнал</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бортжурнал">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <a class="brand" href="#today"><i>✦</i>Бортжурнал</a>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <a href="#today"    data-page="today"    class="tab" style="--c:var(--paper);--cf:var(--paper-f)"><span class="tab-ico" data-ico="today"></span><span class="tab-label">Сегодня</span></a>
    <a href="#plans"    data-page="plans"    class="tab"><span class="tab-ico" data-ico="plans"></span><span class="tab-label">Планы</span></a>
    <button type="button" class="tab tab-add" data-action="quick-add" aria-label="Записать"><span class="tab-ico" data-ico="plus"></span><span class="tab-label">Записать</span></button>
    <a href="#food"     data-page="food"     class="tab" style="--c:var(--food);--cf:var(--food-f)"><span class="tab-ico" data-ico="food"></span><span class="tab-label">Еда</span></a>
    <a href="#budget"   data-page="budget"   class="tab" style="--c:var(--money);--cf:var(--money-f)"><span class="tab-ico" data-ico="budget"></span><span class="tab-label">Бюджет</span></a>
    <a href="#study"    data-page="study"    class="tab" style="--c:var(--study);--cf:var(--study-f)"><span class="tab-ico" data-ico="study"></span><span class="tab-label">Учёба</span></a>
    <a href="#books"    data-page="books"    class="tab" style="--c:var(--books);--cf:var(--books-f)"><span class="tab-ico" data-ico="books"></span><span class="tab-label">Книги</span></a>
    <a href="#quiz"     data-page="quiz"     class="tab" style="--c:var(--quiz);--cf:var(--quiz-f)"><span class="tab-ico" data-ico="quiz"></span><span class="tab-label">Вопросы</span><span class="tab-badge" id="quiz-badge" hidden></span></a>
    <a href="#gym"      data-page="gym"      class="tab" style="--c:var(--gym);--cf:var(--gym-f)"><span class="tab-ico" data-ico="gym"></span><span class="tab-label">Зал</span></a>
    <a href="#steps"    data-page="steps"    class="tab" style="--c:var(--steps);--cf:var(--steps-f)"><span class="tab-ico" data-ico="steps"></span><span class="tab-label">Шаги</span></a>
    <a href="#goal"     data-page="goal"     class="tab"><span class="tab-ico" data-ico="goal"></span><span class="tab-label">Цель</span></a>
    <a href="#stats"    data-page="stats"    class="tab" style="--c:var(--paper);--cf:var(--paper-f)"><span class="tab-ico" data-ico="stats"></span><span class="tab-label">Статистика</span></a>
    <a href="#awards"   data-page="awards"   class="tab" style="--c:var(--mustard);--cf:var(--quiz-f)"><span class="tab-ico" data-ico="awards"></span><span class="tab-label">Награды</span></a>
    <a href="#more"     data-page="more"     class="tab tab-more"><span class="tab-ico" data-ico="more"></span><span class="tab-label">Ещё</span><span class="tab-badge" id="more-badge" hidden></span></a>
    <a href="#settings" data-page="settings" class="tab tab-settings" style="--c:var(--paper-2);--cf:var(--paper-f)"><span class="tab-ico" data-ico="settings"></span><span class="tab-label">Настройки</span></a>
  </nav>
  <main id="main" class="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
